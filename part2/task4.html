<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slide Methods</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .heading {
            cursor: pointer;
            background-color: #f0f0f0;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .panel {
            padding: 10px;
            display: none;
            border: 1px solid #eee;
            border-top: none;
        }
    </style>
</head>
<body>

    <h2>My Favorites (Slide Methods)</h2>

    <div class="heading" id="h1">My Favorite Music</div>
    <div class="panel" id="p1">
        <p>Enrique Iglesias, Shakira</p>
    </div>

    <div class="heading" id="h2">My Favorite Movie</div>
    <div class="panel" id="p2">
        <p>The King's Avatar / Formula 1 racing</p>
    </div>

    <div class="heading" id="h3">My Favorite Subject</div>
    <div class="panel" id="p3">
        <p>Physics and History</p>
    </div>

    <script src="task4.js"></script>
</body>
</html>
